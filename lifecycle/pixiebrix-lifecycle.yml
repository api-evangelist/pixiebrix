      replacement: GET /api/bricks/{id}/versions/ v1.1
      mechanism: Accept header version bump
    - deprecated: GET /api/services/
      replacement: GET /api/registry/bricks/?kind=3
    - deprecated: GET /api/recipes/{name}/
      replacement: GET /api/registry/bricks/{name}/
  spec_deprecated_operations: 0
