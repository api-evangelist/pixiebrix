deprecation:
  policy_published: true
  policy_url: https://docs.pixiebrix.com/developer-api/deprecated-resources
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    PixieBrix publishes a named list of deprecated resources with their
    replacements, but no dated sunset, no notice period, and no RFC 8594
    Sunset/Deprecation response headers. The removal timeline is stated only as
    "slated to be removed in the near future", and the OpenAPI specification marks
    NO operation with `deprecated: true` - so a client cannot detect deprecation
    from the contract at all.
  deprecated_resources:
