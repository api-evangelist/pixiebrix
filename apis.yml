apis:
- aid: pixiebrix-developer-api
  name: PixieBrix Developer API
  description: 'The PixieBrix Developer API is the token-authenticated REST admin and
    package-registry API for PixieBrix teams. It covers organization and group
    management, memberships and invitations, service accounts, mod/package publishing
    to the registry, deployments to end users, PixieBrix databases and records,
    activity and security policies, audit events, campaigns, support copilot
    configuration and a public health check. Requests authenticate with a service
    account token, are versioned through the Accept header, and paginate via RFC 8288
    Link headers.'
  humanURL: https://docs.pixiebrix.com/developer-api
  baseURL: https://app.pixiebrix.com/api/
