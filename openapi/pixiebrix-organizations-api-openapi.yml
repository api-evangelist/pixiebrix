          type: string
          format: date-time
      required:
      - extension_id
      - name
      - version
      - enabled
      - install_type
      - extension_type
    OrganizationReport:
      type: object
      properties:
        metabase_iframe_url:
          type: string
      required:
      - metabase_iframe_url
    DeploymentTelemetry:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          writeOnly: true
          description: The UID of the PixieBrix extension instance (varies by install)
        version:
          type: string
          writeOnly: true
          description: The version of the PixieBrix extension
          pattern: ^(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)(-.*)?$
        active:
          type: array
          items:
            type: object
            properties:
              deployment:
                type: string
                format: uuid
              blueprint:
                type: string
              blueprintVersion:
                type: string
              updatedAt:
                type: string
                description: Last-known server PackageDeployment.updated_at (ISO-8601). Added in extension 3.2.3; omitted in earlier versions.
            required:
            - deployment
            - blueprint
            - blueprintVersion
          writeOnly: true
        extensions:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
              name:
                type: string
              version:
                type: string
                maxLength: 64
              enabled:
                type: boolean
              installType:
                type: string
                description: Raw chrome.management installType (admin/normal/development/sideload/other)
              type:
                type: string
                maxLength: 32
            required:
            - id
            - name
            - version
            - enabled
            - installType
            - type
          writeOnly: true
          description: 'Inventory of browser extensions installed on the device. Optional and backwards-compatible: only sent by managed/enterprise builds where the `management` permission is granted and the org has opted in.'
      required:
      - uid
      - version
