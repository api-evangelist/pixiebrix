components:
  schemas:
    ServiceAuthMeta:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type:
          - string
          - 'null'
          maxLength: 128
        service_id:
          type: string
        service_name:
          type: string
      required:
      - service_id
      - service_name
    OrganizationInstalledExtension:
      type: object
      properties:
        extension_id:
          type: string
        name:
          type: string
        version:
          type: string
        user_count:
          type: integer
        is_managed:
          type: boolean
        install_types:
          type: array
          items:
            type: object
            properties:
              install_type:
                enum:
                - admin
                - normal
                - development
                - sideload
                - other
                type: string
              is_managed:
                type: boolean
              user_count:
                type: integer
            required:
            - install_type
            - is_managed
            - user_count
        last_seen:
          type: string
          format: date-time
      required:
      - extension_id
      - name
      - version
      - user_count
      - is_managed
      - install_types
      - last_seen
    ServiceAccountWithToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        role:
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          type: integer
          default: 4
        created_at:
          type: string
          format: date-time
        last_active_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The last time the user was active. Currently only set for service accounts and support service accounts.
        token:
          type: string
          readOnly: true
      required:
      - name
    PackageMeta:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Surrogate primary key
        name:
          type: string
          description: Unique package identifier, including the scope and collection
          pattern: ^((?<scope>@[a-z0-9-~][a-z0-9-._~]*)/)?((?<collection>[a-z0-9-~][a-z0-9-._~]*)/)?(?<name>[a-z0-9-~][a-z0-9-._~]*)$
          maxLength: 214
        verbose_name:
          type:
          - string
          - 'null'
          description: Human-readable name
          maxLength: 128
        version:
          type: string
          readOnly: true
        kind:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
        sharing:
          type: object
          properties:
            public:
              type: boolean
            organizations:
              type: array
              items:
                type: string
      required:
      - name
      - kind
      - sharing
    DatabaseRecordsArchive:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        database:
          type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            name:
              type: string
              maxLength: 256
          required:
          - name
        date:
          type: string
          format: date
        file:
          type: string
          format: binary
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - database
      - date
      - file
    Database:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 256
        organization_id:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        enforce_schema:
          type: boolean
          description: Enforce the JSON Schema for database records
        owner_field:
          type:
          - string
          - 'null'
          description: Field indicating the record owner
          maxLength: 256
        user:
          type: string
          writeOnly: true
        type:
          enum:
          - Key-Value
          - Asset
          type: string
          default: Key-Value
        last_write_at:
          type: string
          format: date-time
          readOnly: true
        num_records:
          type: integer
          readOnly: true
      required:
      - name
    OrganizationTheme:
      type: object
      properties:
        show_sidebar_logo:
          type: boolean
        logo:
          type:
          - string
          - 'null'
          format: uri
          description: The image URL of a custom logo. Image format must be SVG or PNG.
          maxLength: 200
