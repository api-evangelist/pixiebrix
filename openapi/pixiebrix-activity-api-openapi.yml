      - deleted
    CustomLanguageListEntry:
      type: object
      properties:
        term:
          type: string
        category:
          enum:
          - profanity
          - slurs_hate
          - sexual
          - threats
          - custom
          type: string
        severity:
          enum:
          - low
          - medium
          - high
          type: string
      required:
      - term
      - category
      - severity
    AddressListMatch:
      type: object
      properties:
        identifier:
          type: string
          description: Human reference surfaced in the risk report in place of the raw address (e.g. a fraud-case id or an employee id).
          maxLength: 255
        entry_type:
          enum:
          - fraud
          - employee
          type: string
          description: Whether the address is a known-fraud address or an employee's own.
        level:
          enum:
          - exact
          - building
          - street
          type: string
          description: Granularity this hash row represents (exact / building / street). Set on-device at seed/upload time — the server never normalizes, so it cannot derive closeness itself. One seeded address expands into one row per level, sharing an identifier; the match endpoint returns the finest level that hits.
      required:
      - identifier
      - entry_type
    ActivityExportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          enum:
          - UNKNOWN
          - PENDING
          - STARTED
          - SUCCESS
          - FAILURE
          type: string
        dataset:
          enum:
          - spans
          - events
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        data:
          type:
          - string
          - 'null'
          format: binary
        error_message:
          type:
          - string
          - 'null'
      required:
      - id
      - dataset
