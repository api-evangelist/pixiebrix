        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tasks:
          type: array
          items:
            type: object
            properties:
              trace_id:
                type: string
                format: uuid
              span_id:
                type: string
                format: uuid
              name:
                type: string
              user_id:
                type: string
                format: uuid
              email:
                type:
                - string
                - 'null'
              started_at:
                type: string
                format: date-time
              ended_at:
                type: string
                format: date-time
              handle_ms:
                type: integer
            required:
            - trace_id
            - span_id
            - name
            - user_id
            - email
            - started_at
