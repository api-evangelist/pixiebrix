    CustomLanguageListUpload:
      type: object
      properties:
        organization:
          type: string
          format: uuid
        replace:
          type: boolean
          default: false
        entries:
          type: array
          items:
            type: object
            properties:
              term:
                type: string
                maxLength: 255
              category:
                enum:
                - profanity
                - slurs_hate
                - sexual
                - threats
                - custom
                type: string
                default: custom
              severity:
                enum:
                - low
                - medium
                - high
                type: string
                default: medium
            required:
            - term
      required:
      - organization
      - entries
    CustomLanguageListUploadResult:
      type: object
      properties:
        upserted:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
