                type: string
              level:
                enum:
                - exact
                - building
                - street
                type: string
              hash:
                type: string
                pattern: ^[0-9a-fA-F]{64}$
            required:
            - identifier
            - entry_type
            - level
            - hash
      required:
      - organization
      - entries
    ShadowAiResponse:
