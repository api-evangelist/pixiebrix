                additionalProperties: true
            required:
            - id
            - trace_id
            - span_id
            - user
            - email
            - event_type
            - occurred_at
            - url
            - domain
            - data
        spans_truncated:
          type: boolean
        events_truncated:
          type: boolean
      required:
      - organization
      - user
      - start
      - end
      - tz
      - spans
      - events
      - spans_truncated
      - events_truncated
    TopSitesResponse:
      type: object
