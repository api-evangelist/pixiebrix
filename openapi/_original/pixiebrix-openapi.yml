          pattern: "^(?:[a-z0-9.+-]*)://(?:[^\\s:@/]+(?::[^\\s:@/]*)?@)?(?:(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)(?:\\\
            .(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)){3}|\\[[0-9a-f:.]+\\\
            ]|([a-z\xA1-\uFFFF0-9](?:[a-z\xA1-\uFFFF0-9-]{0,61}[a-z\xA1-\uFFFF0-9])?(?:\\\
            .(?!-)[a-z\xA1-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z\xA1-\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\\
            .?|localhost))(?::[0-9]{1,5})?(?:[/?#][^\\s]*)?\\z"
        expires_at:
          type: string
          format: date-time
        token:
          type: string
      required:
      - connect_link_url
      - expires_at
      - token
    CreateLinkToken:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
    SupportActivitySeedRequest:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          description: Organization to generate the activity data in. Must be one
            the user is an active member of, with activity tracking already enabled.
        weeks:
          type: integer
          maximum: 12
          minimum: 1
          default: 4
          description: Weeks of history to generate, ending today.
        seed:
          type: integer
          description: Optional RNG seed for reproducible data. Omit to derive a stable
            per-user seed.
      required:
      - organization_id
    SupportActivitySeedResult:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
        weeks:
          type: integer
        spans:
          type: integer
          description: Activity spans created.
        events:
          type: integer
          description: Activity events created.
        deleted_spans:
          type: integer
          description: Prior spans removed for this user in this org before seeding.
        deleted_events:
          type: integer
          description: Prior events removed for this user in this org before seeding.
      required:
      - organization_id
      - weeks
      - spans
      - events
      - deleted_spans
      - deleted_events
    SupportServiceAccountWithToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          default: Support Agent
          description: Human-readable name to identify this agent.
          maxLength: 30
        prefix:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_active_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: The last time the user was active. Currently only set for service
            accounts and support service accounts.
        token:
          type: string
          readOnly: true
    ExternalEvent:
      type: object
      properties:
        email:
          type: string
          format: email
        data:
          type: object
          additionalProperties: true
        event:
          type: string
      required:
      - email
      - event
    TourRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tour:
          type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            name:
              type: string
              maxLength: 254
          required:
          - name
          readOnly: true
        status:
          enum:
          - IN_PROGRESS
          - COMPLETED
          - SKIPPED
          type: string
        tour_version:
          type: string
          description: Version of the tour that was run (provided by the frontend)
          pattern: ^(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)(-.*)?$
          maxLength: 254
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - tour_version
    CustomLanguageListUpload:
      type: object
      properties:
        organization:
          type: string
          format: uuid
        replace:
          type: boolean
          default: false
        entries:
          type: array
          items:
            type: object
            properties:
              term:
                type: string
                maxLength: 255
              category:
                enum:
                - profanity
                - slurs_hate
                - sexual
                - threats
                - custom
                type: string
                default: custom
              severity:
                enum:
                - low
                - medium
                - high
                type: string
                default: medium
            required:
            - term
      required:
      - organization
      - entries
    CustomLanguageListUploadResult:
      type: object
      properties:
        upserted:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
      required:
      - upserted
      - deleted
    AddressListUpload:
      type: object
      properties:
        organization:
          type: string
          format: uuid
        replace:
          type: boolean
          default: false
        entries:
          type: array
          items:
            type: object
            properties:
              identifier:
                type: string
                maxLength: 255
              entry_type:
                enum:
                - fraud
                - employee
                type: string
              level:
                enum:
                - exact
                - building
                - street
                type: string
              hash:
                type: string
                pattern: ^[0-9a-fA-F]{64}$
            required:
            - identifier
            - entry_type
            - level
            - hash
      required:
      - organization
      - entries
    AddressListUploadResult:
      type: object
      properties:
        upserted:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
      required:
      - upserted
      - deleted
    UserSettings:
      type: object
      properties:
        scope:
          type: string
          nullable: true
          pattern: ^@[a-z0-9][a-z0-9._-]*$
          maxLength: 128
    AddressListClearResult:
      type: object
      properties:
        deleted:
          type: integer
          minimum: 0
      required:
      - deleted
    PurgeActivityDataResponse:
      type: object
      properties:
        organization:
          type: string
          format: uuid
        spans_deleted:
          type: integer
        events_deleted:
          type: integer
      required:
      - organization
      - spans_deleted
      - events_deleted
