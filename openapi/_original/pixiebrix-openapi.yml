        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: scope
        required: false
        in: query
        description: "Optional. Exact-match team scope (e.g. ``@acme``). Scopes are\
          \ unique, so this returns at most one row \u2014 prefer over ``q`` when\
          \ the scope is known."
        schema:
          type: string
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
