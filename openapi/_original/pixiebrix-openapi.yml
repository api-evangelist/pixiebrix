  /api/activity/address-list/:
    put:
      operationId: updateAddressListUpload
      description: "Replace or upsert the caller's organization known-address list\
        \ from a self-service upload. The uploader hashes each address on-device (see\
        \ ``libs/data-access-base/src/addressHashUtils.ts``) and sends only ``{identifier,\
        \ entry_type, level, hash}`` rows \u2014 raw addresses never leave the browser.\
        \ Each address expands into one row per match level (exact / building / street)\
        \ sharing an ``identifier``. Re-uploading an identifier replaces its whole\
        \ level set (a changed address that now yields fewer levels leaves no stale\
        \ level row); when ``replace`` is true, addresses whose identifier is absent\
        \ from the upload are also deleted so the stored list matches the file exactly.\
        \ ``upserted`` / ``deleted`` count distinct addresses (identifiers), not the\
        \ larger per-level row count. Admin/manager + ``activity-tracking`` flag gated;\
        \ scoped to the caller's organization."
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressListUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressListUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressListUpload'
      responses:
        '200':
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/AddressListUploadResult'
            application/vnd.pixiebrix.api+json; version=1.0:
              schema:
                $ref: '#/components/schemas/AddressListUploadResult'
          description: ''
      tags:
      - activity
    delete:
      operationId: destroyAddressListUpload
      description: Clear the caller's organization known-address list, removing every
        address. Returns the number of addresses deleted. Admin/manager + ``activity-tracking``
        flag gated; scoped to the caller's organization.
      parameters:
      - name: organization
        in: query
        required: true
        description: UUID of the organization whose known-address list to clear.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/AddressListClearResult'
            application/vnd.pixiebrix.api+json; version=1.0:
              schema:
                $ref: '#/components/schemas/AddressListClearResult'
          description: ''
      tags:
      - activity
