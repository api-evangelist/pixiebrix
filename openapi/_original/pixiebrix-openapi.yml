  /api/activity/reports/security-event-context/:
    get:
      operationId: listSecurityEventContexts
      description: "Return the activity context surrounding a single security event\
        \ (``event``) \u2014 the enclosing trace's references and security events,\
        \ plus other same-agent security events within a few minutes (any trace),\
        \ each carrying its full detail \u2014 for the before/after timeline on the\
        \ event detail. Resolution is by event id within the organization, with no\
        \ date-range / group filter, so a shared link always resolves the anchor within\
        \ the recipient's permission scope. Restricted to organization admins/managers\
        \ and gated by the activity-tracking flag."
      parameters:
      - name: organization
        in: query
        required: true
        description: UUID of the organization to scope the report to.
        schema:
          type: string
          format: uuid
      - name: event
        in: query
        required: true
        description: UUID of the security event to build surrounding context around.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json; version=1.0:
              schema:
                $ref: '#/components/schemas/SecurityEventContextResponse'
            application/vnd.pixiebrix.api+json; version=1.0:
              schema:
                $ref: '#/components/schemas/SecurityEventContextResponse'
          description: ''
      tags:
      - activity
  /api/activity/reports/shadow-ai/:
    get:
      operationId: listShadowAis
      description: Return shadow-AI usage rolled up per AI tool and per member from
        the on-device AI-prompt security events, for a member (``user``) or across
        one or more groups (``groups``), else the whole organization. Each tool reports
        how many PII-bearing prompts were seen, how many were intervened (block/softBlock/redact),
        and how many distinct members used it; each member reports the same counts
        and the tools they used. Tools are attributed at report time from the shipped
        AI-tool catalog. Restricted to organization admins/managers and gated by the
        activity-tracking flag.
      parameters:
      - name: organization
        in: query
        required: true
        description: UUID of the organization to scope the report to.
        schema:
          type: string
          format: uuid
      - name: user
        in: query
        required: false
        description: Optional member UUID to scope the report to one user.
        schema:
          type: string
          format: uuid
      - name: groups
        in: query
        required: false
        description: Optional group UUIDs to scope the report; repeated (?groups=a&groups=b)
          or comma-separated (?groups=a,b).
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - name: start
        in: query
        required: false
        description: Optional ISO-8601 start of the report window (inclusive).
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        description: Optional ISO-8601 end of the report window (exclusive).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          content:
            application/json; version=1.0:
