components:
  schemas:
    EffectivePolicyResponse:
      type: object
      properties:
        organization:
          type: string
          format: uuid
        schemaVersion:
          type: integer
        config:
          type: object
          additionalProperties: true
        policies:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              version:
                type: integer
            required:
            - id
            - version
      required:
      - organization
      - schemaVersion
      - config
      - policies
    ProhibitedLanguageCorpus:
      type: object
      properties:
        version:
          type: integer
        terms:
          type: array
          items:
            type: object
            properties:
              term:
                type: string
              category:
                enum:
                - profanity
                - sexual
                - slurs_hate
                type: string
              severity:
                enum:
                - low
                - medium
                - high
                type: string
            required:
            - term
            - category
            - severity
      required:
      - version
      - terms
    CustomLanguageListEntry:
      type: object
      properties:
        term:
          type: string
        category:
          enum:
          - profanity
          - slurs_hate
          - sexual
          - threats
          - custom
          type: string
        severity:
          enum:
          - low
          - medium
          - high
          type: string
      required:
      - term
      - category
      - severity
    AddressListMatch:
      type: object
      properties:
        identifier:
          type: string
          description: Human reference surfaced in the risk report in place of the
            raw address (e.g. a fraud-case id or an employee id).
          maxLength: 255
        entry_type:
          enum:
          - fraud
          - employee
          type: string
          description: Whether the address is a known-fraud address or an employee's
            own.
        level:
          enum:
          - exact
          - building
          - street
          type: string
          description: "Granularity this hash row represents (exact / building / street).\
            \ Set on-device at seed/upload time \u2014 the server never normalizes,\
            \ so it cannot derive closeness itself. One seeded address expands into\
            \ one row per level, sharing an identifier; the match endpoint returns\
            \ the finest level that hits."
      required:
      - identifier
      - entry_type
    AddressListSummary:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
      required:
      - count
    ActivityPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
        name:
          type: string
          maxLength: 256
        config:
          type: object
          additionalProperties: true
          description: Policy configuration (signals, PII knobs, task definitions,
            URL rules); validated against the versioned activity policy JSON Schema.
        version:
          type: integer
          readOnly: true
        groups:
          type: array
          items:
            type: string
          description: Organization groups this policy applies to.
        assigned_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
            required:
            - id
            - name
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - organization
      - name
    MemberPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        assigned_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
            required:
            - id
            - name
          readOnly: true
        matching_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
            required:
            - id
            - name
          readOnly: true
    MemberTimelineResponse:
      type: object
      properties:
        organization:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tz:
          type: string
        spans:
          type: array
          items:
            type: object
            properties:
              trace_id:
                type: string
                format: uuid
              span_id:
                type: string
                format: uuid
              parent_span_id:
                type: string
                format: uuid
                nullable: true
              user:
                type: string
                format: uuid
              email:
                type: string
                nullable: true
              kind:
                enum:
                - task
                - page_session
                - subtask
                - custom
                - interaction
                type: string
              name:
                type: string
              started_at:
                type: string
                format: date-time
              ended_at:
                type: string
                format: date-time
              focused_ms:
                type: integer
              idle_ms:
                type: integer
              visible_ms:
                type: integer
              background_ms:
                type: integer
              active_input_ms:
                type: integer
              active_input_samples:
                type: integer
              attributes:
                type: object
                additionalProperties: true
              classification:
                type: string
                nullable: true
            required:
            - trace_id
            - span_id
            - parent_span_id
            - user
            - email
            - kind
            - name
            - started_at
            - ended_at
            - focused_ms
            - idle_ms
            - visible_ms
            - background_ms
            - active_input_ms
            - active_input_samples
            - attributes
            - classification
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              trace_id:
                type: string
                format: uuid
              span_id:
                type: string
                format: uuid
                nullable: true
              user:
                type: string
                format: uuid
              email:
                type: string
                nullable: true
              event_type:
                type: string
              occurred_at:
                type: string
                format: date-time
              url:
                type: string
              domain:
                type: string
              data:
