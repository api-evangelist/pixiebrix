      - support
  /api/support/users/{id}/activity/seed/:
    post:
      operationId: createSupportUserActivitySeed
      description: Generate demo activity-tracking data (spans + events) for a single user in one of their organizations, for building Activity Overview demos. The organization must already have the activity-tracking flag enabled. Any existing activity for this user in that organization is deleted first so re-runs replace rather than accumulate. Dev/demo tooling — not for production customer data.
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportActivitySeedRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportActivitySeedRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportActivitySeedRequest'
      responses:
        '201':
          content:
            application/json; version=2.0:
              schema:
                $ref: '#/components/schemas/SupportActivitySeedResult'
            application/vnd.pixiebrix.api+json; version=2.0:
              schema:
                $ref: '#/components/schemas/SupportActivitySeedResult'
          description: ''
      tags:
      - support
  /api/support/mod-copilot-sessions/{id}/feedback/:
    post:
      operationId: createSupportConsoleModCopilotSessionFeedback
