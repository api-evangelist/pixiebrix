note: >-
  PixieBrix ships NO first-party MCP server. Searched and probed 2026-08-26:
  mcp.pixiebrix.com does not resolve; POST tools/list to
  https://app.pixiebrix.com/mcp returned HTTP 403 (Django forbidden, not an MCP
  handshake) and https://app.pixiebrix.com/api/mcp/ returned 404; the docs site
  (429-entry llms.txt at https://docs.pixiebrix.com/llms.txt) contains no MCP page;
  the 18-repo GitHub org publishes no MCP server. Third-party MCP wrappers for
  PixieBrix exist (viaSocket, Zapier) but are NOT first-party and are not credited
  here. The tools below are a DERIVED CANDIDATE surface - what a PixieBrix MCP
  server would expose if one existed - grounded in real operationIds from the
  published OpenAPI. Nothing here is live and no endpoint URL is asserted.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
probes:
  - url: https://app.pixiebrix.com/mcp
    method: POST tools/list
    status: 403
  - url: https://app.pixiebrix.com/api/mcp/
    method: POST tools/list
    status: 404
  - url: https://mcp.pixiebrix.com/mcp
    method: POST tools/list
    status: '<no response> - host does not resolve'
  - url: https://docs.pixiebrix.com/llms.txt
    method: GET
    status: 200
    finding: no MCP server documented anywhere in the 429-entry docs index
third_party_servers:
