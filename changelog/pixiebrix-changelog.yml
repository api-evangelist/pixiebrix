  - version: 3.3.0
    date: null
    status: current
    url: https://docs.pixiebrix.com/release-notes/release-3.3.0
    breaking: false
    highlights:
      - 'Enhancement: Security Policies (AI Prompt, Prohibited Language, Clipboard,
        Page-Pattern rules) now enforce inside iframed editable fields, including
        the Salesforce email composer (CKEditor4)'
      - 'Fix: HTTP Requests re-read credentials before sending, so background
        requests are no longer sent unauthenticated after a cold start'
      - 'Fix: triggers configured without a selector now report a configuration
        error instead of a generic failure'
      - 'Fix: Admin Console Activity Policies table search box now filters the list'
  - version: 3.2.10
    date: '2026-08-11'
    url: https://docs.pixiebrix.com/release-notes/release-3.2.10
    breaking: false
    highlights:
      - 'Hardened built-in brick input schemas: reject non-finite, negative or zero
        values driving loops, polling deadlines and cache expiry, and reject blank
        values interpolated into registration ids'
      - 'Page Editor advisory warning when a mod uses an extension-only brick that
        would hard-fail on the Web App'
      - 'Audio Capture: distinct reporting of tab close / navigation / native "Stop
        sharing" vs a deliberate stop, and full media-track release on abnormal end'
      - 'Reliability: background maintenance tasks moved to chrome.alarms so
        schedules survive browser restarts and service-worker teardown'
