    declared anywhere in the PixieBrix contract. The market PixieBrix sells into -
    browser-layer automation and AI-agent activity governance - has no established
    interoperability standard for this pipeline to test against, and PixieBrix's
    activity/policy resources (/api/activity/policies/, /api/activity/ingest/,
